<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escrituras — Ceci Milano</title>
  <meta name="description" content="Poemas de Ceci Milano">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0e0f;
      --surface: #161618;
      --surface2: #1e1e21;
      --border: rgba(255,255,255,0.07);
      --text: #e8e0d5;
      --text-muted: #8a8480;
      --accent: #c9a96e;
      --accent2: #8b6f47;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Lato', sans-serif;
      font-weight: 300;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ── HERO ── */
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }

    .hero-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 2s ease;
      z-index: 0;
    }

    .hero-video.loaded {
      opacity: 1;
    }

    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom,
        rgba(14,14,15,0.55) 0%,
        rgba(14,14,15,0.35) 40%,
        rgba(14,14,15,0.65) 80%,
        rgba(14,14,15,0.95) 100%
      );
      z-index: 1;
      pointer-events: none;
    }

    .hero > *:not(.hero-video) {
      position: relative;
      z-index: 2;
    }

    .hero-ornament {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 0.85rem;
      letter-spacing: 0.3em;
      color: var(--accent);
      text-transform: uppercase;
      opacity: 0.7;
      margin-bottom: 2rem;
    }

    .hero-title {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(3.5rem, 10vw, 8rem);
      letter-spacing: -0.02em;
      line-height: 0.95;
      color: var(--text);
      margin-bottom: 1.5rem;
    }

    .hero-title span {
      display: block;
      font-style: italic;
      color: var(--accent);
    }

    .hero-subtitle {
      font-family: 'Lato', sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.4em;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 4rem;
    }

    .hero-divider {
      width: 1px;
      height: 80px;
      background: linear-gradient(to bottom, var(--accent), transparent);
      margin: 0 auto;
    }

    .scroll-hint {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      letter-spacing: 0.3em;
      color: var(--text-muted);
      text-transform: uppercase;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.9; }
    }

    /* ── POEMS GRID ── */
    .poems-section {
      max-width: 1400px;
      margin: 0 auto;
      padding: 6rem 2rem;
    }

    .section-header {
      text-align: center;
      margin-bottom: 5rem;
    }

    .section-label {
      font-size: 0.75rem;
      letter-spacing: 0.4em;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 1rem;
    }

    .section-title {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(2rem, 5vw, 3.5rem);
      color: var(--text);
    }

    .poems-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 2px;
    }

    .poem-card {
      position: relative;
      aspect-ratio: 16/10;
      overflow: hidden;
      cursor: pointer;
      background: var(--surface);
    }

    .poem-card:nth-child(3n+1) { aspect-ratio: 16/10; }
    .poem-card:nth-child(3n+2) { aspect-ratio: 4/3; }
    .poem-card:nth-child(3n) { aspect-ratio: 3/2; }

    .poem-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94), filter 0.4s;
      filter: brightness(0.75) saturate(0.9);
    }

    .poem-card:hover img {
      transform: scale(1.05);
      filter: brightness(0.85) saturate(1.05);
    }

    .poem-card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.2) 50%, transparent 100%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 2rem;
      transition: background 0.3s;
    }

    .poem-card:hover .poem-card-overlay {
      background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.4) 60%, rgba(0,0,0,0.1) 100%);
    }

    .poem-number {
      font-size: 0.7rem;
      letter-spacing: 0.3em;
      color: var(--accent);
      opacity: 0.7;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
    }

    .poem-card-title {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(1.1rem, 2.5vw, 1.6rem);
      color: var(--text);
      line-height: 1.2;
      margin-bottom: 0.5rem;
    }

    .poem-preview {
      font-size: 0.8rem;
      color: rgba(232,224,213,0.55);
      line-height: 1.5;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s, opacity 0.3s;
      opacity: 0;
      font-style: italic;
    }

    .poem-card:hover .poem-preview {
      max-height: 80px;
      opacity: 1;
    }

    .poem-card-read {
      margin-top: 1rem;
      font-size: 0.7rem;
      letter-spacing: 0.3em;
      color: var(--accent);
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(5px);
      transition: opacity 0.3s, transform 0.3s;
    }

    .poem-card:hover .poem-card-read {
      opacity: 1;
      transform: translateY(0);
    }

    /* ── MODAL ── */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s;
      backdrop-filter: blur(12px);
    }

    .modal-backdrop.open {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      width: 100%;
      max-width: 960px;
      max-height: 90vh;
      display: flex;
      background: var(--surface);
      border: 1px solid var(--border);
      transform: translateY(20px);
      transition: transform 0.4s;
      overflow: hidden;
    }

    .modal-backdrop.open .modal {
      transform: translateY(0);
    }

    .modal-image-panel {
      width: 45%;
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
    }

    .modal-image-panel img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .modal-image-panel::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to right, transparent, rgba(22,22,24,0.3));
    }

    .modal-content {
      flex: 1;
      overflow-y: auto;
      padding: 3rem 3rem 3rem 2.5rem;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .modal-content::-webkit-scrollbar { width: 4px; }
    .modal-content::-webkit-scrollbar-thumb { background: var(--border); }

    .modal-poem-number {
      font-size: 0.7rem;
      letter-spacing: 0.4em;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 0.75rem;
      opacity: 0.7;
    }

    .modal-poem-title {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(1.6rem, 4vw, 2.5rem);
      color: var(--text);
      line-height: 1.1;
      margin-bottom: 2.5rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    .modal-poem-body {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: 1.1rem;
      line-height: 1.9;
      color: rgba(232,224,213,0.88);
      white-space: pre-wrap;
    }

    .modal-close {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      width: 40px;
      height: 40px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.05);
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      z-index: 10;
      transition: color 0.2s, border-color 0.2s;
    }

    .modal-close:hover {
      color: var(--text);
      border-color: var(--accent);
    }

    .modal-nav {
      display: flex;
      gap: 0.5rem;
      margin-top: 2.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
    }

    .modal-nav button {
      flex: 1;
      padding: 0.75rem;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      cursor: pointer;
      font-family: 'Lato', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      transition: all 0.2s;
    }

    .modal-nav button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* ── FOOTER ── */
    footer {
      text-align: center;
      padding: 4rem 2rem;
      border-top: 1px solid var(--border);
    }

    footer .footer-title {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.4rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }

    footer p {
      font-size: 0.8rem;
      color: var(--text-muted);
      opacity: 0.5;
      letter-spacing: 0.1em;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      .poems-grid {
        grid-template-columns: 1fr 1fr;
      }
      .modal {
        flex-direction: column;
        max-height: 95vh;
        margin: 1rem;
      }
      .modal-image-panel {
        width: 100%;
        height: 220px;
      }
      .modal-content {
        padding: 1.5rem;
      }
      .modal-image-panel::after {
        background: linear-gradient(to bottom, transparent, rgba(22,22,24,0.4));
      }
    }

    @media (max-width: 480px) {
      .poems-grid {
        grid-template-columns: 1fr;
      }
      .poem-card { aspect-ratio: 16/9 !important; }
    }
  </style>
</head>
<body>

<!-- HERO -->
<section class="hero">
  <video class="hero-video" id="heroVideo" autoplay muted loop playsinline preload="auto">
    <source src="public/hero.mp4" type="video/mp4">
  </video>
  <p class="hero-ornament">una colección de poemas</p>
  <h1 class="hero-title">
    Escrituras
    <span>Ceci</span>
  </h1>
  <p class="hero-subtitle">veintiún poemas</p>
  <div class="hero-divider"></div>
  <p class="scroll-hint">↓ leer</p>
</section>

<!-- POEMS GRID -->
<section class="poems-section">
  <div class="section-header">
    <p class="section-label">los poemas</p>
    <h2 class="section-title">cada uno, un mundo</h2>
  </div>
  <div class="poems-grid" id="poemsGrid"></div>
</section>

<!-- FOOTER -->
<footer>
  <p class="footer-title">Escrituras — Ceci</p>
  <p>poesía</p>
</footer>

<!-- MODAL -->
<div class="modal-backdrop" id="modalBackdrop">
  <button class="modal-close" id="modalClose">✕</button>
  <div class="modal">
    <div class="modal-image-panel">
      <img id="modalImg" src="" alt="">
    </div>
    <div class="modal-content">
      <p class="modal-poem-number" id="modalNumber"></p>
      <h2 class="modal-poem-title" id="modalTitle"></h2>
      <pre class="modal-poem-body" id="modalBody"></pre>
      <div class="modal-nav">
        <button id="prevBtn">← anterior</button>
        <button id="nextBtn">siguiente →</button>
      </div>
    </div>
  </div>
</div>

<script>
// Hero video fade-in
const heroVideo = document.getElementById('heroVideo');
if (heroVideo) {
  heroVideo.addEventListener('canplay', () => heroVideo.classList.add('loaded'));
  heroVideo.addEventListener('loadeddata', () => heroVideo.classList.add('loaded'));
}

const poems = [
  {
    id: 'sin-forma',
    title: 'SIN FORMA',
    preview: 'hay cosas que se sienten / y no se pueden decir...',
    body: `hay cosas que se sienten
y no se pueden decir
pero tampoco callar
lo que nos pasa
no se acomoda
ni a mis ganas
ni a tu calma
se desliza entre lo posible
y lo que nunca fue dicho
como si el deseo bastara
para inventar un camino
yo no quiero más preguntas sin respuestas
ni citas sueltas como excusas
ni abrazos que duran menos
que lo que tardo en necesitarte de nuevo
me encantaría quedarme
pero no sé cómo hacerlo
sin dejarme partes en el intento
y vos
tan sereno
tan ahí
tan lejos
te pienso con ternura
pero ya no con certeza
y me duele
porque querer tanto
no alcanza`
  },
  {
    id: 'siempre-ahora',
    title: 'SIEMPRE AHORA',
    preview: 'Nos entendemos en silencios, / con esa certeza tácita...',
    body: `Nos entendemos en silencios,
con esa certeza tácita de que
la eternidad no es nuestra.
Nos reímos de las preguntas
que otros se harían,
porque sabemos que,
si nos miramos demasiado,
se disuelven las palabras.
Preferimos bailar entre las horas,
como si el tiempo se anudara solo en nuestro abrazo,
como si nadie más existiera
en esa habitación inventada.
Lo que tenemos es un pacto sin promesas,
un refugio momentáneo
donde no importa el después,
ni la diferencia de calendarios,
ni la imposibilidad de coincidir
más allá de estas noches.
Sabemos que estamos hechos de un mismo fuego,
pero que el fuego,
también,
quema.
Así que preferimos rozarnos sin atarnos,
perdernos sin buscarnos,
ser dos llamas en un cuarto oscuro
que solo brillan cuando se encuentran.
A veces, en medio de un beso,
siento la urgencia de preguntarte,
de armar con palabras
eso que nunca nombramos.
Pero me callo.
Porque sé que si abro la boca,
la razón va a meterse entre nosotros,
va a querer entender
lo que solo el cuerpo explica.
De vez en cuando me pregunto
si este juego tiene un final o si ya terminó
y nosotros seguimos danzando
como si nada importara.
Pero entonces tus manos me buscan,
y yo me rindo,
sin cuestionar nada,
sin pensar más allá de este instante.
Y cuando te vas,
no me pregunto nada.

Solo sé que volvés,
como si el presente fuera el único lugar
donde nos encontramos de verdad.`
  },
  {
    id: 'familia',
    title: 'Familia',
    preview: 'llegué a la mesa vacía de ganas...',
    body: `llegué a la mesa vacía de ganas
con esa duda tonta
de si el amor era para mí
los cubiertos chocaban suave
había migas de pan
luces amarillas, otras blancas
y voces que ya conocía de memoria
alguien preguntó cómo estaba
otro me sirvió más papas
se cruzaron chistes viejos
ojos que me miraban como si nada doliera
respiré sonrisas
me abrazaron risas de un calor conocido
y en ese ruido tranquilo
se me aflojaron las espinas
entendí despacio
entre platos usados y vasos sudados
que lo que yo llamaba vacío
hace rato se sentaba conmigo
que quizás no falte amor
sino ojos
para verlo donde siempre estuvo
llenándome el plato
y el pecho`
  },
  {
    id: 'las-agujas-siguieron',
    title: 'Las agujas siguieron',
    preview: 'Nuevamente sonó ese viejo reloj...',
    body: `Nuevamente sonó ese viejo reloj,
quejoso marcó
el día, la hora, el segundo,
y egocéntrico me miró.

Prefería yo mirarte, pero
estabas teñida de él,
se adueñó de vos.
Es que aunque jugamos a desarmarlo
y volver a acomodarlo,
las agujas siguieron su paso.
Y hoy solo te veo
en esos retazos
y tiempos escasos.
Después de un intercambio, accedió,
movió sus agujas a mi antojo,
pero burlón susurró
que la rosa perdió su color.`
  },
  {
    id: 'homicidio-culposo',
    title: 'HOMICIDIO CULPOSO',
    preview: '"Viniste a desarmarme, / a romperme a besos..."',
    body: `"Viniste a desarmarme,
a romperme a besos,
a cortarme a latidos sincronizados
y sin necesidad alguna,"
me dijiste y te fuiste.
Te fuiste porque te elegías,
capaz por primera vez,
a vos antes que a esos veinte minutos
de piel ardiendo
y esas posteriores veinte horas
de mi indiferencia absoluta.
Destruí lo que me unió a esto,
es que era perfecto pero yo,
yo no podía.
Necesitaba sentirnos libres
y te encarcelé
de la forma más cruel
que pude
y que me dejaste.
Es que vos querías,
pero debí entender que no era así,
que solo no sabías irte
y yo usaba nuestro desorden
para ordenarme.

Te fuiste cuando estabas sangrando,
intentaste irte ileso y acompañado,
pero terminaste en ruinas
y sin rumbo alguno.
"No me lo merecía,"
dijiste.
Te agarré tan fuerte como pude la mano,
porque responderte sería,
una vez más,
buscarle la vuelta para acomodarme,
desordenándote.
No lo merecías,
pero yo no pude.
Y capaz lo necesitabas,
y también capaz es,
devuelta,
ponerme primero afirmar eso.
Te juro que intenté empujarte,
echarte,
y tampoco pude.
No podía tenerte,
no podía elegirte.
Es que necesitaba que te vayas,
pero que vuelvas
cuando me quemaba el frío,
y esa culpa.
Pero capaz que fui esa tormenta,
que, cambiando la literatura,
anuncia,
al fin,
tu calma.
Te vi romperte,
llorarme,
pedirme,
esperarme,
pero amor,
no podía.
Fui yo antes,
esa víctima que se convierte en victimario

y se justifica con eso,
y ahora lo entiendo.
Capaz se acercó a la muerte mi paso por tu camino,
y ni siquiera ese perdón,
casi susurrado que te dije,
va a devolverte igual.
Pero también capaz fue eso
lo más lindo
de mi homicidio culposo.`
  },
  {
    id: 'el-saqueo',
    title: 'EL SAQUEO: carta al cáncer',
    preview: 'Me la robaste, / incluso mucho antes...',
    body: `Me la robaste,
incluso mucho antes
de que lo pudiera notar.
Saqueaste el último bloque sólido
que aún sostenía a mi roble más fuerte.
Me la sacaste,
jugaste silenciosamente
a esa jugada
que nadie te podría ganar nunca.
Y lo sabías.
Sabías que jugaba con desventaja
y lo hiciste igual.
Nos miraste soberbiamente
más de una vez,
observaste mi llanto desconsolado
agarrada de su mano,
y te la llevaste igual.
Hiciste tu danza mortal,
de a poco, callada,
y aparentemente amigable
pintaste de negro
cada parte de su carne.
Cuando compraste ilícitamente
tu primer hogar en su interior,
nunca tuviste intenciones de irte,
aunque jugabas a que sí.
Poco a poco te la ibas llevando
y cuando te logré ver,
y lloré,
y grité,
y de rodillas te pedí que pares,
te reíste,
y te quedaste.
Para qué,
si te ibas a ir con ella.
Por qué desprenderla de mis brazos
si tu fin estaba en el suyo.
Tu maldad era tan gigante
como tu lugar en su cuerpo.
Así que fuiste de a poco
y me hiciste ver su final
desde tu aparente principio.
La apagaste,
y le robaste
tantas, tantas horas,
tantas sonrisas,
para darle
ardor,
molestia,
angustia.
Pero no estabas contento,
así que
primero su andar,
luego su voz.
Y ese día,
y otros tantos
en los que te odié más que al diablo,
en los que me viste desfilar
inquieta por ese cuarto
sabiendo que te la llevabas,
me apagaste la luz
sacándome sus ojos.

Pero igual estuviste ahí,
para comerle hasta la paz,
para no dejarla ni descansar.
Necesitabas más
y yo solo quería
que no existieras,
aunque eso implicara
que ella tampoco.
Tuve que soltarla
porque dejártela
sería odiarla,
y solo te odio a vos.
Yo no la tengo más,
pero vos tampoco.
Ya no se ríe de mis chistes,
pero no llora por tus escombros.
Tuviste meses de su vida,
yo dieciocho años.`
  },
  {
    id: 'si',
    title: 'Si',
    preview: 'Si yo nunca iba, / si vos nunca venías...',
    body: `Si yo nunca iba,
si vos nunca venías.
Si esas eternas despedidas
lo hubieran sido.
Es que nos despedíamos sin despedirnos,
para irnos sin despedirnos,
y hasta con una sonrisa.
Si solo hubieras escuchado,
o yo hubiese hablado.
Si vos querías cuando yo,
o yo quería cuando vos.
Si tan solo no hubieran habido haberes,
y ese día te lo decía,
o esa noche vos venías,
y esa tarde lo admitía.

Si estabas acá o yo allá,

let currentIndex = 0;

function openModal(index) {
  currentIndex = index;
  const poem = poems[index];
  document.getElementById('modalImg').src = `public/images/${poem.id}.jpg`;
  document.getElementById('modalImg').alt = poem.title;
  document.getElementById('modalNumber').textContent = `${String(index + 1).padStart(2, '0')} / ${poems.length}`;
  document.getElementById('modalTitle').textContent = poem.title;
  document.getElementById('modalBody').textContent = poem.body;
  document.getElementById('modalBackdrop').classList.add('open');
  document.body.style.overflow = 'hidden';
  // Scroll modal content to top
  document.querySelector('.modal-content').scrollTop = 0;
}

function closeModal() {
  document.getElementById('modalBackdrop').classList.remove('open');
  document.body.style.overflow = '';
}

document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('modalBackdrop').addEventListener('click', (e) => {
  if (e.target === document.getElementById('modalBackdrop')) closeModal();
});

document.getElementById('prevBtn').addEventListener('click', () => {
  openModal((currentIndex - 1 + poems.length) % poems.length);
});
document.getElementById('nextBtn').addEventListener('click', () => {
  openModal((currentIndex + 1) % poems.length);
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
  if (e.key === 'ArrowLeft') openModal((currentIndex - 1 + poems.length) % poems.length);
  if (e.key === 'ArrowRight') openModal((currentIndex + 1) % poems.length);
});

// Build grid
const grid = document.getElementById('poemsGrid');
poems.forEach((poem, index) => {
  const card = document.createElement('div');
  card.className = 'poem-card';
  card.innerHTML = `
    <img src="public/images/${poem.id}.jpg" alt="${poem.title}" loading="lazy">
    <div class="poem-card-overlay">
      <p class="poem-number">${String(index + 1).padStart(2, '0')}</p>
      <h3 class="poem-card-title">${poem.title}</h3>
      <p class="poem-preview">${poem.preview}</p>
      <p class="poem-card-read">leer poema →</p>
    </div>
  `;
  card.addEventListener('click', () => openModal(index));
  grid.appendChild(card);
});
</script>
